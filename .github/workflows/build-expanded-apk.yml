name: Build & Sign Expanded Edition APKs (v1.0.0)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-expanded-apk:
    name: Analyze, Test, Build & Sign Expanded APKs (Universal + ARM8 + ARM7)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Expanded Corpus Asset (v6 — 338,134 poems)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets/db
          gh release download corpus-expanded-v1 \
            -p "bayt_qafiyah_merged.db.gz" \
            -D assets/db/ \
            --clobber
          ls -lh assets/db/bayt_qafiyah_merged.db.gz

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Gradle wrapper exists in android/
        run: |
          if [ ! -f android/gradlew ]; then
            mkdir -p /tmp/gw && cd /tmp/gw
            touch settings.gradle.kts
            gradle wrapper --gradle-version 9.5.0
            cp gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
            mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
            cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/"
          fi
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        run: flutter analyze

      - name: Run all unit & corpus tests (v5 + v6)
        run: flutter test

      - name: Build & Sign Expanded Universal, ARM64 (arm8) & ARMv7 (arm7) Release APKs
        env:
          SIGN_KEY_PK8_B64: ${{ secrets.SIGN_KEY_PK8_B64 }}
          SIGN_CERT_PEM_B64: ${{ secrets.SIGN_CERT_PEM_B64 }}
        run: |
          mkdir -p dist

          # 1. Universal Expanded Release APK (arm64-v8a + armeabi-v7a)
          flutter build apk --release --flavor expanded --dart-define=EDITION=expanded --target-platform android-arm64,android-arm || true
          UNI_RAW=$(find build/app/outputs -name "*expanded-release*.apk" | grep -v "arm64\|armeabi" | head -n 1)
          if [ -n "$UNI_RAW" ] && [ -f "$UNI_RAW" ]; then
            cp "$UNI_RAW" dist/raw-universal.apk
          else
            echo "ERROR: No universal expanded release APK was produced!"
            find build/app/outputs -maxdepth 4 -ls || true
            exit 1
          fi

          # 2. Split-per-ABI Expanded Release APKs (arm64-v8a & armeabi-v7a)
          flutter build apk --release --flavor expanded --dart-define=EDITION=expanded --split-per-abi --target-platform android-arm64,android-arm || true
          find build/app/outputs -name "*.apk" -ls
          ARM64_RAW=$(find build/app/outputs -name "*arm64-v8a*expanded-release*.apk" -o -name "*expanded*arm64-v8a*release*.apk" | head -n 1)
          ARM7_RAW=$(find build/app/outputs -name "*armeabi-v7a*expanded-release*.apk" -o -name "*expanded*armeabi-v7a*release*.apk" | head -n 1)
          if [ -z "$ARM64_RAW" ] || [ -z "$ARM7_RAW" ]; then
            echo "ERROR: Missing split ABI Expanded APKs (ARM64=$ARM64_RAW, ARM7=$ARM7_RAW)!"
            exit 1
          fi
          cp "$ARM64_RAW" dist/raw-arm64-v8a.apk
          cp "$ARM7_RAW" dist/raw-armeabi-v7a.apk

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          KEY_DIR=$(mktemp -d)
          trap 'rm -rf "$KEY_DIR"' EXIT
          echo "$SIGN_KEY_PK8_B64" | base64 -d > "$KEY_DIR/key.pk8"
          echo "$SIGN_CERT_PEM_B64" | base64 -d > "$KEY_DIR/cert.x509.pem"

          sign_apk() {
            local IN_RAW="$1"
            local OUT_SIGNED="$2"
            local ALIGNED="${OUT_SIGNED}.aligned.apk"
            "$ZIPALIGN" -p -f -v 4 "$IN_RAW" "$ALIGNED" > /dev/null
            "$APKSIGNER" sign \
              --key "$KEY_DIR/key.pk8" \
              --cert "$KEY_DIR/cert.x509.pem" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$OUT_SIGNED" \
              "$ALIGNED"
            rm -f "$ALIGNED" "$IN_RAW"
            echo "=== Verified signature for $OUT_SIGNED ==="
            "$APKSIGNER" verify --verbose --print-certs "$OUT_SIGNED"
          }

          sign_apk dist/raw-universal.apk dist/BaytAlQaseed-Expanded-v1.0.0-universal.apk
          sign_apk dist/raw-arm64-v8a.apk dist/BaytAlQaseed-Expanded-v1.0.0-arm64-v8a.apk
          sign_apk dist/raw-armeabi-v7a.apk dist/BaytAlQaseed-Expanded-v1.0.0-armeabi-v7a.apk

          rm -rf "$KEY_DIR"

      - name: Verify Signed Expanded APKs & Flavor Asset Isolation
        run: |
          ls -lh dist/BaytAlQaseed-Expanded-v1.0.0-*.apk
          for APK in dist/BaytAlQaseed-Expanded-v1.0.0-universal.apk dist/BaytAlQaseed-Expanded-v1.0.0-arm64-v8a.apk dist/BaytAlQaseed-Expanded-v1.0.0-armeabi-v7a.apk; do
            echo "=== Checking assets in $APK ==="
            unzip -l "$APK" | grep -E "bayt_qafiyah_merged\.db\.gz|libsqlite3\.so|libapp\.so"
            if unzip -l "$APK" | grep -q "bayt_al_qaseed\.db\.gz"; then
              echo "ERROR: Standard DB leaked into Expanded APK!"
              exit 1
            fi
          done

      - name: Upload Signed Expanded APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaytAlQaseed-Expanded-v1.0.0-signed-apks
          path: |
            dist/BaytAlQaseed-Expanded-v1.0.0-universal.apk
            dist/BaytAlQaseed-Expanded-v1.0.0-arm64-v8a.apk
            dist/BaytAlQaseed-Expanded-v1.0.0-armeabi-v7a.apk
          retention-days: 90

      - name: Publish Signed Expanded APKs to Unified GitHub Release (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          printf '%s\n' \
            "الإصدار الرسمي الموقّع **1.0.0** من تطبيق **بيت القصيد** بنسختيه القياسية والموسّعة (٦ ملفات APK موقّعة)." \
            "" \
            "### 1. النسخة القياسية (\`com.baytalqaseed.app\`) — ٨٦ ألف قصيدة · ١٫٦ مليون بيت" \
            "- \`BaytAlQaseed-v1.0.0-arm64-v8a.apk\` — نسخة **ARM8 (64-bit)** (موصى بها لمعظم الهواتف الحديثة)." \
            "- \`BaytAlQaseed-v1.0.0-armeabi-v7a.apk\` — نسخة **ARM7 (32-bit)** (للهواتف الأقدم)." \
            "- \`BaytAlQaseed-v1.0.0-universal.apk\` — النسخة **الشاملة (Universal)**." \
            "" \
            "### 2. النسخة الموسّعة (\`com.baytalqaseed.expanded\`) — ٣٣٨ ألف قصيدة · ٥٫٦ مليون بيت · ١٢٧ شعوراً · ١٠ أغراض" \
            "- \`BaytAlQaseed-Expanded-v1.0.0-arm64-v8a.apk\` — نسخة **ARM8 (64-bit)** (موصى بها لمعظم الهواتف الحديثة)." \
            "- \`BaytAlQaseed-Expanded-v1.0.0-armeabi-v7a.apk\` — نسخة **ARM7 (32-bit)** (للهواتف الأقدم)." \
            "- \`BaytAlQaseed-Expanded-v1.0.0-universal.apk\` — النسخة **الشاملة (Universal)**." \
            > dist/release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/BaytAlQaseed-Expanded-v1.0.0-universal.apk \
              dist/BaytAlQaseed-Expanded-v1.0.0-arm64-v8a.apk \
              dist/BaytAlQaseed-Expanded-v1.0.0-armeabi-v7a.apk \
              --clobber
            gh release edit "$TAG" --title "بيت القصيد v1.0.0 (النسخة القياسية + الموسّعة)" --notes-file dist/release_notes.md
          else
            gh release create "$TAG" \
              dist/BaytAlQaseed-Expanded-v1.0.0-universal.apk \
              dist/BaytAlQaseed-Expanded-v1.0.0-arm64-v8a.apk \
              dist/BaytAlQaseed-Expanded-v1.0.0-armeabi-v7a.apk \
              --title "بيت القصيد v1.0.0 (النسخة القياسية + الموسّعة)" \
              --notes-file dist/release_notes.md
          fi
