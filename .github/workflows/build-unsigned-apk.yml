name: Build & Sign Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-apk:
    name: Analyze, Test, Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Gradle wrapper exists in android/
        run: |
          if [ ! -f android/gradlew ]; then
            mkdir -p /tmp/gw && cd /tmp/gw
            touch settings.gradle.kts
            gradle wrapper --gradle-version 9.5.0
            cp gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
            mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
            cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/"
          fi
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        run: flutter analyze

      - name: Run unit & FTS5 database tests
        run: flutter test

      - name: Build & Sign Release APK with Encrypted Key
        env:
          SIGN_KEY_PK8_B64: ${{ secrets.SIGN_KEY_PK8_B64 }}
          SIGN_CERT_PEM_B64: ${{ secrets.SIGN_CERT_PEM_B64 }}
        run: |
          flutter build apk --release --target-platform android-arm64,android-arm || true
          mkdir -p dist
          if [ -f build/app/outputs/apk/release/app-release-unsigned.apk ]; then
            RAW_APK="build/app/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            RAW_APK="build/app/outputs/flutter-apk/app-release.apk"
          else
            echo "ERROR: No release APK was produced!"
            find build/app/outputs -maxdepth 4 -ls || true
            exit 1
          fi
          cp "$RAW_APK" dist/BaytAlQaseed-release-unsigned.apk

          # Locate Android build-tools zipalign & apksigner
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          "$ZIPALIGN" -p -f -v 4 "$RAW_APK" dist/aligned.apk > /dev/null

          KEY_DIR=$(mktemp -d)
          trap 'rm -rf "$KEY_DIR"' EXIT
          echo "$SIGN_KEY_PK8_B64" | base64 -d > "$KEY_DIR/key.pk8"
          echo "$SIGN_CERT_PEM_B64" | base64 -d > "$KEY_DIR/cert.x509.pem"

          "$APKSIGNER" sign \
            --key "$KEY_DIR/key.pk8" \
            --cert "$KEY_DIR/cert.x509.pem" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/BaytAlQaseed-v1.0.0.apk \
            dist/aligned.apk

          rm -f dist/aligned.apk
          rm -rf "$KEY_DIR"

          echo "=== Verifying APK Signature (v1/v2/v3) ==="
          "$APKSIGNER" verify --verbose --print-certs dist/BaytAlQaseed-v1.0.0.apk

      - name: Verify APK integrity & bundled assets
        run: |
          APK="dist/BaytAlQaseed-v1.0.0.apk"
          ls -lh "$APK" dist/BaytAlQaseed-release-unsigned.apk
          echo "=== Verifying bundled DB, native SQLite3, fonts & WebP artwork ==="
          unzip -l "$APK" | grep -E "bayt_al_qaseed\.db\.gz|libsqlite3\.so|libapp\.so|ArefRuqaa|ReemKufi|Amiri|ScheherazadeNew|Mirza|IBMPlexSansArabic|parchment_texture\.webp|calligraphy_bg\.webp"

      - name: Upload Signed & Unsigned APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaytAlQaseed-v1.0.0-release
          path: |
            dist/BaytAlQaseed-v1.0.0.apk
            dist/BaytAlQaseed-release-unsigned.apk
          retention-days: 90

      - name: Publish Signed & Unsigned APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-unsigned"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/BaytAlQaseed-v1.0.0.apk dist/BaytAlQaseed-release-unsigned.apk --clobber
          else
            gh release create "$TAG" dist/BaytAlQaseed-v1.0.0.apk dist/BaytAlQaseed-release-unsigned.apk \
              --title "بيت القصيد v1.0.0 (Signed & Unsigned Release APK)" \
              --notes "الإصدار **1.0.0** من تطبيق **بيت القصيد** (يتضمن النسخة الموقّعة الجاهزة للتثبيت المباشر \`BaytAlQaseed-v1.0.0.apk\` والنسخة غير الموقّعة)."
          fi
