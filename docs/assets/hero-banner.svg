<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191612"/>
      <stop offset="52%" stop-color="#14120E"/>
      <stop offset="100%" stop-color="#211A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#C8A25F" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#8C5E35" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#14120E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CE95"/>
      <stop offset="50%" stop-color="#C8A25F"/>
      <stop offset="100%" stop-color="#9A703E"/>
    </linearGradient>
  </defs>

  <!-- Outer Dark Parchment Canvas -->
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <!-- Inner Classical Manuscript Double Frame -->
  <rect x="16" y="16" width="1168" height="328" rx="20" fill="none" stroke="url(#gold)" stroke-opacity="0.38" stroke-width="1.3"/>
  <rect x="24" y="24" width="1152" height="312" rx="15" fill="none" stroke="#C8A25F" stroke-opacity="0.14" stroke-width="0.9"/>

  <!-- Subtle Geometric Corner Ornaments -->
  <g stroke="#C8A25F" stroke-opacity="0.45" stroke-width="1.2" fill="none">
    <path d="M36 56 L36 36 L56 36"/>
    <path d="M1164 56 L1164 36 L1144 36"/>
    <path d="M36 304 L36 324 L56 324"/>
    <path d="M1164 304 L1164 324 L1144 324"/>
  </g>

  <!-- Left Subtle Poetic Watermark Pattern -->
  <g opacity="0.09" stroke="#E8CE95" fill="none" stroke-width="1">
    <circle cx="195" cy="180" r="118"/>
    <circle cx="195" cy="180" r="88"/>
    <rect x="133" y="118" width="124" height="124" transform="rotate(45 195 180)"/>
    <rect x="133" y="118" width="124" height="124"/>
  </g>

  <!-- Bespoke Rub-el-Hizb + Qalam Emblem (Right Side for RTL) -->
  <g transform="translate(970, 96)">
    <rect x="0" y="0" width="144" height="144" rx="34" fill="#1F1B15" stroke="url(#gold)" stroke-opacity="0.65" stroke-width="1.8"/>
    <rect x="33" y="33" width="78" height="78" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
    <rect x="33" y="33" width="78" height="78" fill="none" stroke="url(#gold)" stroke-width="2.4" transform="rotate(45 72 72)"/>
    <!-- Calligraphy Qalam Nib -->
    <path d="M72 36 L90 77 L72 108 L54 77 Z" fill="#F4EDE0"/>
    <line x1="72" y1="69" x2="72" y2="106" stroke="#1F1B15" stroke-width="2.6"/>
    <circle cx="72" cy="68" r="4.5" fill="#C8A25F"/>
  </g>

  <!-- Main Arabic Title & Editorial Subtitle (RTL aligned right) -->
  <text x="935" y="148" text-anchor="end" fill="#F5EFE3" font-family="serif" font-size="66" font-weight="700" direction="rtl">بيت القصيد</text>
  <text x="935" y="196" text-anchor="end" fill="#D5B274" font-family="sans-serif" font-size="22" font-weight="600" direction="rtl">ديوان الشعر العربي بتجربة قراءة تحريرية فاخرة — دون اتصال بالإنترنت</text>

  <!-- Ornamental Divider Line -->
  <line x1="350" y1="226" x2="935" y2="226" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="929" y="222" width="8" height="8" transform="rotate(45 933 226)" fill="#C8A25F"/>

  <!-- Key Stats Pills -->
  <g font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <rect x="780" y="250" width="155" height="38" rx="19" fill="#252018" stroke="#C8A25F" stroke-opacity="0.45"/>
    <text x="857" y="274" fill="#F2E8D5">١٬١٦٢٬١١٩ بيتاً</text>

    <rect x="608" y="250" width="156" height="38" rx="19" fill="#252018" stroke="#C8A25F" stroke-opacity="0.45"/>
    <text x="686" y="274" fill="#F2E8D5">٩٠٬٢٣٨ قصيدة</text>

    <rect x="452" y="250" width="140" height="38" rx="19" fill="#252018" stroke="#C8A25F" stroke-opacity="0.45"/>
    <text x="522" y="274" fill="#F2E8D5">٥٤٢ شاعراً</text>

    <rect x="296" y="250" width="140" height="38" rx="19" fill="#252018" stroke="#C8A25F" stroke-opacity="0.45"/>
    <text x="366" y="274" fill="#F2E8D5">١١ عصراً أدبياً</text>

    <rect x="118" y="250" width="162" height="38" rx="19" fill="#C8A25F"/>
    <text x="199" y="274" fill="#171410">الإصدار 1.0.0</text>
  </g>
</svg>
