name: bayt_al_qaseed
description: بيت القصيد — ديوان الشعر العربي بتجربة قراءة تحريرية فاخرة.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.5
  share_plus: ^10.1.4
  dynamic_color: ^1.7.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/bayt_qafiyah_merged.db.xz
    - assets/images/parchment_texture.webp
    - assets/images/calligraphy_bg.webp

  fonts:
    - family: ArefRuqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Regular.ttf
          weight: 400
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700
    - family: Gulzar
      fonts:
        - asset: assets/fonts/Gulzar-Regular.ttf
          weight: 400
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Regular.ttf
          weight: 400
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
          weight: 400
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Ruwudu
      fonts:
        - asset: assets/fonts/Ruwudu-Regular.ttf
          weight: 400
        - asset: assets/fonts/Ruwudu-Bold.ttf
          weight: 700
    - family: Mirza
      fonts:
        - asset: assets/fonts/Mirza-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mirza-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mirza-Bold.ttf
          weight: 700
    - family: Harmattan
      fonts:
        - asset: assets/fonts/Harmattan-Regular.ttf
          weight: 400
        - asset: assets/fonts/Harmattan-Bold.ttf
          weight: 700
    - family: Katibeh
      fonts:
        - asset: assets/fonts/Katibeh-Regular.ttf
          weight: 400
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lateef-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
          weight: 400
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
